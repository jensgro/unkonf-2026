# view-transitions
Jens Grochtdreis | unkonf Mannheim, 2026

<!--s-->

## Agenda

1. API
2. Pseudo-Elements
3. Live Demo

<!--s-->
## Das Ausgangsproblem

Bei einem Seitenwechel oder einem Wechsel des Zustands einer Seite (z.B. ein Modal öffnen) passiert der Wechsel sofort. Das kann zu einem unschönen "Ruckeln" führen.

<!--v-->
### Zwei Lösungen

1. Auf der selben Seite bleiben und animieren (Same-Document View Transitions).
2. Auf eine andere Seite wechseln und dabei animieren (Cross-Document View Transitions).

<!--v-->

### Wo View Transitions greifen

<dl>
  <dt>Navigation</dt>
  <dd>Seitenwechsel, Tab-Umschaltung, Routing</dd>

  <dt>Interaktionen</dt>
  <dd>Filter, Favoriten, Modals, Karten-Details</dd>

  <dt>State-Umschaltungen</dt>
  <dd>Dark Mode, Layout-Mode, Produktstatus</dd>

  <dt>Special Effects</dt>
  <dd>Morphing von Icons, Chips, Bildern oder Panels</dd>

</dl>

<!--v-->

### Die neue API

**[View Transitions](https://developer.mozilla.org/en-US/docs/Web/API/View_Transition_API)** regeln den Übergang zwischen zwei Zuständen einer Seite oder zwischen zwei Seiten.

Javascript ist nur nötig, wenn man die Animationen steuern möchte und wenn man auf der selben Seite bleibt. Zwischen Seiten kann man die API auch ohne Javascript nutzen. 

<!--v-->

### Browser support

Same-Document View Transitions sind seit Oktober 2025 **Baseline**. Cross-Document View Transitions bietet Firefox leider noch nicht.

### Snapshots sind die Grundlage

* "Snapshot" des aktuellen Zustands
* "Snapshot" des neuen Zustands
* Automatische Erstellung einer Morphing-Animation zwischen passenden Elementen
<!--s-->

## Same-Document 

Für Same-Document View Transitions bleibt man auf derselben Seite und animiert den Übergang zwischen zwei Zuständen. Zum Triggern der Animation benötigen wir JavaScript:

```javascript
// Ein- und Ausblenden eines Dialogs
const dialog = document.querySelector("#dialog");
document.querySelector("#open").addEventListener("click", () => {
    document.startViewTransition?.(() => dialog.showModal());
});
document.querySelector("#close").addEventListener("click", () => {
    document.startViewTransition?.(() => dialog.close());
});

```

## Die neuen Pseudoelemente

<dl>
  <dt><code>::view-transition-group(group-name)</code></dt>
  <dd>Der Container für ein spezifisches Element.</dd>
  <dt><code>::view-transition-old(name)</code></dt>
  <dd>Der "alte" Zustand des Elements.</dd>
  <dt><code>::view-transition-new(name)</code></dt>
  <dd>Der "neue" Zustand des Elements.</dd>
</dl>

<!--v-->

### Wichtiges zu den Pseudo-Elementen

- Nur Elemente mit dem passenden `view-transition-name` werden animiert. Alle anderen Elemente werden sofort ersetzt. 
- Sie sind nur für die Animation zuständig und haben keine eigene Logik.
- Sie können mit CSS-Animationen oder Transitionen animiert werden.
- Sie können auch mit `mix-blend-mode` kombiniert werden, um kreative Effekte zu erzielen.
- Die Zustände sind **Snapshots**, also Bilder der Elemente. 
<!--v-->
### Ein Beispiel

```css
.card {
    /* NUR diese Zeile macht das Element morphbar */
    view-transition-name: card;
}
/* Der Container der gemorpht wird */
::view-transition-group(card) {
    animation-duration: 0.8s;
    animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
/* Der alte Zustand: fade out + rotate */
::view-transition-old(card) {
    animation: fade-rotate-out 0.4s ease-in forwards;
}
/* Der neue Zustand: fade in + scale */
::view-transition-new(card) {
    animation: scale-in 0.4s 0.4s ease-out forwards;
}
```

Mit [benannten Gruppen](demos/die-neuen-pseudoelemente.html) die Animation gezielt steuern.

<!--v-->

## View-Transitions zwischen Seiten

View-Transitions können auch beim Wechsel zwischen verschiedenen Seiten genutzt werden. Dabei werden die Snapshots der Elemente auf der alten Seite mit denen auf der neuen Seite gemorpht, sofern die `view-transition-name` übereinstimmen.

Dafür benötigen wir nur CSS.

[Im CSS des ersten Beispiels](demos/vt-1.html) können wir mit ein paar Modifikationen die Animation anpassen.
<!--v-->

### Wir merken uns

```css
/* Das triggert die View-Transition beim Seitenwechsel */
@view-transition {
    navigation: auto;
}
```
Wenn wir es gut machen wollen:
```css
@media (prefers-reduced-motion: no-preference) {
  @view-transition {
    navigation: auto;
  }
}
```
Der Standardübergang ist ein **cross-fade**.

<!--v-->

### Ein eigener Cross-fade

```css
::view-transition-old(root) { animation: fade-out 0.3s ease both;}
::view-transition-new(root) { animation: fade-in 0.3s ease both;}

@keyframes fade-out {
  to {opacity: 0; }
}
@keyframes fade-in {
  from {opacity: 0;}
}
```
[Eigene Animation erstellen (lassen)](https://tools.digrart.jp/de/css-view-transition-generator/)

### Während der Animation

Während der Animation können wir Elementegezielt stylen, z. B. um sie hervorzuheben oder auszublenden:

```css
h2 {
  display: none;
  color: white;
}
root:active-view-transition h2 {
  display: block;
}
html:active-view-transition button {
  visibility: hidden;
}
```
`:active-view-transition` ist die Pseudo-Klasse, die während der Animation aktiv ist. Sie bezieht sich immer auf das Root-Element, also auf das `<html>`-Element.

<!--s-->

<!--v-->

###  Glossar – Die wichtigsten Begriffe & Selektoren

| Begriff / Selektor | Was es ist | Wann du es nutzt |
|---|---|---|
| **`document.startViewTransition()`** | JS-API zum Auslösen | Immer bei Same-Document (SPA, Tabs, Filter) |
| **`view-transition-name`** | CSS-Property am Element | **Pflicht**, damit der Browser das Element morphen kann |
| **`::view-transition-group(name)`** | Container der Animation | Steuert Timing, Dauer, Easing (die „Hülle") |
| **`::view-transition-old(name)`** | Der „alte" Zustand (Snapshot) | Styling des Ausgangsbilds (z. B. `opacity: 0`, `rotate`) |
| **`::view-transition-new(name)`** | Der „neue" Zustand (Snapshot) | Styling des Zielbilds (z. B. `scale(0.5)` → `scale(1)`) |
| **`@view-transition`** | CSS-At-Rule (Cross-Document) | **Nur** bei echter Navigation zwischen HTML-Dateien |
| **`:active-view-transition`** | Pseudo-Klasse | Möglichkeit, Elemente während der Animation zu stylen |
