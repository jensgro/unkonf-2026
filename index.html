# view-transitions
Jens Grochtdreis | unkonf Mannheim, 2026

<!--s-->

## Agenda

1. API
2. Pseudo-Elements
3. Live Demo

<!--s-->
## Ausgangsproblem

Bei einem Seitenwechel oder einem Wechsel des Zustands einer Seite (z.B. ein Modal öffnen) wird der alte Zustand sofort entfernt und der neue Zustand sofort angezeigt. Das kann zu einem unschönen „Ruckeln" führen.

<!--v-->
## Zwei Lösungen

1. Auf der selben Seite bleiben und den Zustand wechseln (Same-Document View Transitions).
2. Auf eine andere Seite wechseln und den Zustand wechseln (Cross-Document View Transitions).

**View Transitions** sind eine neue API, die es ermöglicht, den Übergang zwischen zwei Zuständen einer Seite oder zwischen zwei Seiten zu animieren.

<!--v-->

## Browser support

Auf der selben Seite ist die API bereits **Baseline** (seit Oktober 2025) und funktioniert in allen modernen Browsern. Für den Wechsel zwischen zwei Seiten ist die API noch nicht überall stabil (Firefox fehlt teilweise).

Javascript ist nur nötig, wenn man die Animationen steuern oder die Pseudo-Elemente anpassen möchte. Ansonsten kann man die API auch ohne Javascript nutzen. 

<!--s-->
## Die API: `document.startViewTransition()` 

* **So funktioniert es:**

* Der Browser macht ein "Snapshot" des aktuellen Zustands.
* Du löst das Update aus.
* Der Browser macht ein "Snapshot" des neuen Zustands.
* Er berechnet automatisch eine Morphing-Animation zwischen passenden Elementen.

```javascript
document.startViewTransition(() => {
// Trigger DOM update here
document.body.innerHTML = '<h1>Neuer Inhalt</h1>';
});
```

## Entwicklung & Debugging

* **Chrome DevTools:**
* Tab **„View Transitions"** (unter „Elements" oder „Performance").
* Funktion: Zeigt das interne Shadow DOM, Snapshots und die Namen der Gruppen live an.
* **CodeSandbox / StackBlitz:** Vorlagen suchen nach „CSS View Transitions" für schnelle Starts ohne Build-Tool.

**4. Browser-Support Check (Live-Check)**

* *Hinweis:* Same-Document ist seit Oktober 2025 **Baseline** und funktioniert in allen modernen Browsern.
* *Achtung:* Cross-Document ist noch nicht überall stabil (Firefox fehlt teilweise)[1].
