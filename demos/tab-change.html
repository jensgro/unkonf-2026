<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab-Wechsel ohne Seitenneuladen</title>
    <style>

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 1.25rem;
        }
        button {
            padding: 0.8rem 1.6rem;
            border: none;
            border-radius: 8px;
            background: #754ba5;
            color: #e7e7ec;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 30px;
            font-weight: bold;
        }
        main {
            margin-top: 20px;
            max-width: 60%;
            padding: 20px;
            background: #666;
            color: #fff;
        }
    </style>
</head>
<body>
    <button onclick="showTab('home')">Home</button>
    <button onclick="showTab('settings')">Einstellungen</button>
    
    <main id="content">Startseite</main>
    
    <script>
        function showTab(tab) {
            if (!document.startViewTransition) {
                updateContent(tab);
                return;
            }

            document.startViewTransition(() => updateContent(tab));
        }

        function updateContent(tab) {
            document.querySelector("#content").textContent =
                tab === "home" ? "Startseite" : "Einstellungen";
        }
    </script>
    
    <style>
        ::view-transition-old(root) {
            animation: fade-out 150ms ease;
        }
    
        ::view-transition-new(root) {
            animation: fade-in 150ms ease;
        }
    
        @keyframes fade-out {
            to {
                opacity: 0;
            }
        }
    
        @keyframes fade-in {
            from {
                opacity: 0;
            }
        }
    </style>
</body>
</html>
