<!DOCTYPE html>
<html lang="de">

    <head>
        <meta charset="UTF-8">
        <title>Demo 3 – Blur Crossfade</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                min-height: 100vh;
                background: #181825;
                color: #cdd6f4;
                margin: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2rem;
            }

            .content {
                width: 400px;
                height: 250px;
                border-radius: 16px;
                display: grid;
                place-items: center;
                font-size: 3rem;
                font-weight: bold;
                /* Wichtig: Nur dieses Element transitionieren */
                view-transition-name: content;
            }

            .page-a {
                background: #89dceb;
                color: #181825;
            }

            .page-b {
                background: #f38ba8;
                color: #181825;
            }

            button {
                padding: 0.8rem 1.6rem;
                border: none;
                border-radius: 8px;
                background: #94e2d5;
                color: #181825;
                cursor: pointer;
                font-size: 1rem;
            }

            /* === KREATIVER EFFEKT === */
            ::view-transition-group(content) {
                animation-duration: 0.6s;
                /* Mix-Blend für interessanten Überlappungseffekt */
                mix-blend-mode: difference;
            }

            ::view-transition-old(content) {
                animation: blur-out 0.3s ease-in forwards;
            }

            ::view-transition-new(content) {
                animation: blur-in 0.3s 0.3s ease-out forwards;
            }

            @keyframes blur-out {
                to {
                    opacity: 0;
                    filter: blur(12px);
                    transform: scale(1.1);
                }
            }

            @keyframes blur-in {
                from {
                    opacity: 0;
                    filter: blur(12px);
                    transform: scale(0.9);
                }

                to {
                    opacity: 1;
                    filter: blur(0);
                    transform: scale(1);
                }
            }
        </style>
    </head>

    <body id="demo3">
        <div class="content page-a" id="content">PAGE A</div>
        <button id="nav">Navigation →</button>

        <script>
            const content = document.getElementById('content');
            let isA = true;

            document.getElementById('nav').addEventListener('click', () => {
                isA = !isA;
                document.startViewTransition(() => {
                    content.className = isA ? 'content page-a' : 'content page-b';
                    content.textContent = isA ? 'PAGE A' : 'PAGE B';
                });
            });
        </script>
    </body>

</html>
